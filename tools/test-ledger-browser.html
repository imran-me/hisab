<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="hisab:standalone" content="test harness">
<title>Ledger reversal — browser test</title>
<style>
  body { font: 14px/1.6 ui-monospace, monospace; background: #06080B; color: #C9D2DA; padding: 2rem; }
  .pass { color: #6EE7A8; } .fail { color: #FF8199; } h1 { font-size: 1rem; }
</style>
</head>
<body>
<h1>Ledger reversal — browser test</h1>
<pre id="out"></pre>

<!--
  The LOCAL half of "recorded is final".

  The PHP suite covers the server. This covers modules/ledger/backend/api.js,
  which has to reach the same answer on its own - because when there is no
  backend it IS the ledger, and when there is one it is still written first. If
  the client edited in place while the server reversed, the two would hold
  different histories of the same money and neither would look wrong.

  Runs entirely against local storage, so it needs no backend and no session.
-->
<script type="module">
import * as ledger from '../modules/ledger/backend/api.js';
import * as accounts from '../modules/accounts/backend/api.js';

const out = document.getElementById('out');
let passed = 0;
const failures = [];

function check(label, condition) {
  if (condition) { passed++; out.innerHTML += `<span class="pass">  ok  </span>${label}\n`; }
  else { failures.push(label); out.innerHTML += `<span class="fail">  FAIL</span> ${label}\n`; }
}

(async function run() {
  try {
    ledger.reset();

    const list = await accounts.list({});
    const cash = list.data?.[0];

    // The mirror image of the auth harness: this one runs against LOCAL data,
    // so a backend that answers 401 leaves it with no accounts to post against.
    // Skipped rather than failed - api-contract.md is explicit that a 401 must
    // never fall through to local data, so an empty list here is correct
    // behaviour, not a fault. Run it against `python -m http.server`.
    if (!cash) {
      out.innerHTML += '<span class="fail">  --  </span>no local accounts (a backend is answering) — skipped';
      document.title = 'RESULT|SKIP|0|0|needs a static server, not tools/serve.php';
      return;
    }

    // --- an ordinary expense ------------------------------------------------
    const made = await ledger.create({
      type: 'expense', account_id: cash.id, amount_minor: 45000,
      currency: cash.currency, occurred_on: '2026-09-05', payee: 'Shwapno',
    });
    check('an expense is recorded', made.ok === true);
    const originalId = made.data.id;

    // --- correcting it ------------------------------------------------------
    const fixed = await ledger.update(originalId, { amount_minor: 4500 }, 'Typo');
    check('correcting succeeds', fixed.ok === true);

    const all = (await ledger.list({ includeReversed: true, includeBothLegs: true })).data;
    const original = all.find((r) => r.id === originalId);
    const mirror = all.find((r) => r.reverses_id === originalId);
    const replacement = all.find((r) => r.corrects_id === originalId);

    // The whole point: the original is untouched.
    check('the original still says 45000', original?.amount_minor === 45000);
    check('a mirror was written', Boolean(mirror));
    check('the mirror is the opposite direction', mirror?.direction === 'in');
    check('the mirror carries the reason', mirror?.reversal_reason === 'Typo');
    check('the replacement says 4500', replacement?.amount_minor === 4500);

    // Dated today, never backdated - a correction must not change a month that
    // has already been looked at.
    //
    // Compared against the app's own today(), NOT toISOString().slice(0,10).
    // occurred_on is a LOCAL calendar date by contract, and toISOString is UTC:
    // east of Greenwich the two are different days from midnight until the
    // offset runs out, so this test failed at 01:09 local and would have passed
    // again by morning. A test that is wrong for six hours a day is worse than
    // no test, because the failure looks like a real one.
    const { today } = await import('../shared/js/core/dates.js');
    check('the mirror is dated today', mirror?.occurred_on === today());

    // --- what the list shows -------------------------------------------------
    const shown = (await ledger.list({})).data;
    check('the list shows one row, not three', shown.filter((r) => r.payee === 'Shwapno').length === 1);
    check('and it is the corrected one', shown.find((r) => r.payee === 'Shwapno')?.amount_minor === 4500);

    // --- the balance nets ----------------------------------------------------
    const balances = (await ledger.balances({})).data;
    const opening = list.data[0].opening_balance_minor || 0;
    check('the balance reflects only the corrected figure', balances[cash.id] === opening - 4500);

    // --- reversing outright ---------------------------------------------------
    const second = await ledger.create({
      type: 'expense', account_id: cash.id, amount_minor: 20000,
      currency: cash.currency, occurred_on: '2026-09-06', payee: 'Agora',
    });
    const rev = await ledger.reverse(second.data.id, 'Wrong account');
    check('reversing succeeds', rev.ok === true);

    const afterRev = (await ledger.list({ includeReversed: true })).data;
    check('the reversed entry still exists', afterRev.some((r) => r.id === second.data.id));
    check('and it is gone from the list', !(await ledger.list({})).data.some((r) => r.id === second.data.id));

    const b2 = (await ledger.balances({})).data;
    check('and it no longer moves the balance', b2[cash.id] === opening - 4500);

    // --- reversing twice is refused -------------------------------------------
    const again = await ledger.reverse(second.data.id, 'again');
    check('reversing twice is refused', again.ok === false);

    // --- repeat (swipe right, and the Undo after a reversal) -------------------
    const copy = await ledger.repeat(made.data.id);
    check('repeat records a new entry', copy.ok === true && copy.data.id !== made.data.id);
    check('repeat is dated today', copy.data?.occurred_on === today());
    check('repeat keeps the payee and the account', copy.data?.payee === 'Shwapno' && copy.data?.account_id === cash.id);
    const restored = await ledger.repeat(second.data.id, { occurred_on: '2026-09-06' });
    check('undoing a reversal records it again on its own date', restored.ok === true && restored.data.occurred_on === '2026-09-06');
    const mirrorRow = afterRev.find((r) => r.reverses_id === second.data.id);
    check('a reversal is not an entry to repeat', (await ledger.repeat(mirrorRow.id)).ok === false);
    const others = list.data.filter((a) => a.id !== cash.id && a.currency === cash.currency);
    if (others.length) {
      const move = await ledger.create({
        type: 'transfer', account_id: cash.id, to_account_id: others[0].id, amount_minor: 1000,
        currency: cash.currency, occurred_on: '2026-09-07',
      });
      const again2 = await ledger.repeat(move.data.id);
      const legs = await ledger.group(again2.data);
      check('a transfer repeats as a transfer, both legs', legs.length === 2 && legs.some((l) => l.account_id === others[0].id && l.direction === 'in'));
    }

    // --- a foreign-currency row moves its account by its converted value ---
    // A USD 12.99 charge on a taka account used to move it by ৳12.99.
    const beforeUsd = (await ledger.balances({})).data[cash.id];
    const usd = await ledger.create({
      type: 'expense', account_id: cash.id, amount_minor: 1299,
      currency: 'USD', occurred_on: '2026-09-07', payee: 'Cloud',
    });
    const snap = Number(usd.data?.fx_rate);
    const afterUsd = (await ledger.balances({})).data[cash.id];
    const { convert } = await import('../shared/js/core/money.js');
    check('a USD row snapshots a rate', cash.currency === 'USD' || (Number.isFinite(snap) && snap > 0));
    check('and moves the taka balance by its taka value, not by 12.99',
      cash.currency === 'USD' || beforeUsd - afterUsd === convert(1299, 'USD', cash.currency, snap));

    // --- a month total reads the row's snapshot, not today's rate -----------
    // Changing today's USD rate must not rewrite September's spending.
    if (cash.currency === 'BDT') {
      const fx = await import('../modules/fx/backend/api.js');
      const before = (await ledger.summary({ period: '2026-09', currency: 'BDT' })).data.expense_minor;
      await fx.setRate('USD', 'BDT', 200);
      const after = (await ledger.summary({ period: '2026-09', currency: 'BDT' })).data.expense_minor;
      check('a new rate today does not change last month\'s converted total', before === after);
      fx.invalidate();
    }

    // --- the draft survives the sheet being dismissed ------------------------
    // It was never written: sheet.js removes the sheet before onClose runs,
    // and the draft's isConnected guard returned every time.
    {
      const { storage, KEYS } = await import('../shared/js/core/storage.js');
      const { openEntrySheet } = await import('../modules/ledger/entry-sheet.js');
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = async (sel) => { for (let i = 0; i < 80 && !document.querySelector(sel); i++) await wait(50); };
      storage.remove(KEYS.DRAFT);

      let sheet = await openEntrySheet({});
      await until('[data-key="2"]');
      for (const k of ['2', '5', '0']) document.querySelector(`[data-key="${k}"]`).click();
      await wait(400);
      check('draft: typing writes it, before any close', storage.get(KEYS.DRAFT, null)?.amount_minor === 25000);

      sheet.close('backdrop');
      await wait(600);
      check('draft: still there after the sheet is dismissed', storage.get(KEYS.DRAFT, null)?.amount_minor === 25000);

      sheet = await openEntrySheet({});
      await until('[data-key="2"]');
      check('draft: the reopened sheet shows it', document.querySelector('#entry-amount')?.value === '250');

      // Clearing the amount clears the draft.
      for (let i = 0; i < 4; i++) document.querySelector('[data-key="back"]').click();
      await wait(400);
      check('draft: clearing the amount clears it', storage.get(KEYS.DRAFT, null) === null);
      sheet.close('closed');
      await wait(600);
    }

    // --- the entry sheet's number pad ------------------------------------------
    // Pure functions, so they are checked here without opening a sheet. The
    // pad is the only way an amount gets typed on a phone, so what it refuses
    // is as much a part of the ledger as what the API refuses.
    const pad = await import('../modules/ledger/numpad.js');
    const keys = (seq, places = 2) => seq.reduce((b, k) => pad.press(b, k, places), '');

    check('pad: 2-5-0 is 250 taka', pad.evaluate(keys(['2', '5', '0']), 'BDT') === 25000);
    check('pad: 120+45 is 165', pad.evaluate(keys(['1', '2', '0', '+', '4', '5']), 'BDT') === 16500);
    check('pad: 500-120 is 380', pad.evaluate(keys(['5', '0', '0', '-', '1', '2', '0']), 'BDT') === 38000);
    check('pad: a third decimal cannot be typed', keys(['1', '2', '.', '9', '9', '9']) === '12.99');
    check('pad: 0.1+0.2 is exactly 30 poisha', pad.evaluate(keys(['.', '1', '+', '.', '2']), 'BDT') === 30);
    check('pad: no decimal point in yen', keys(['5', '.', '5'], 0) === '55');
    check('pad: no leading zeros', keys(['0', '0', '7']) === '7');
    check('pad: 00 on nothing is one zero', keys(['00']) === '0');
    check('pad: an operator cannot start a sum', keys(['+', '-', '5']) === '5');
    check('pad: a second operator replaces the first', keys(['9', '+', '-', '1']) === '9-1');
    check('pad: a trailing operator is ignored', pad.evaluate('120+', 'BDT') === 12000);
    check('pad: backspace', keys(['1', '2', 'back']) === '1');
    check('pad: empty is null, not zero', pad.evaluate('', 'BDT') === null);
    check('pad: a sum below zero is negative, for the sheet to refuse', pad.evaluate('5-9', 'BDT') < 0);
    check('pad: bufferFor round-trips', pad.evaluate(pad.bufferFor(123450, 'BDT'), 'BDT') === 123450);
    check('pad: bufferFor drops zero poisha', pad.bufferFor(25000, 'BDT') === '250');
    check('pad: grouping is Indian for taka', pad.pretty('125000+5', 'BDT') === '1,25,000 + 5');

  } catch (err) {
    check(`no exception escaped (${err?.message ?? err})`, false);
  }

  ledger.reset();
  document.title = `RESULT|${failures.length === 0 ? 'PASS' : 'FAIL'}|${passed}|${failures.length}|${failures.join(' ; ')}`;
})();
</script>
</body>
</html>
