<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisab · institution tiles</title>
<!--
  Every bank, wallet and card tile bankLogo() can draw, at the three sizes the
  app uses, in the app's own stylesheet. Open it (or shoot it) to see at a
  glance which institutions have a real logo and which a monogram:

    PAGES=tools/institutions.html node tools/shoot-mobile.mjs

  ?theme=day shows the day palette.
-->
<link rel="stylesheet" href="../shared/css/hisab.css">
<style>
  body { padding: 16px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11.5px; color: var(--text-2); }
  .sizes { display: flex; align-items: center; gap: 6px; }
  h2 { font-size: 15px; margin: 20px 0 10px; }
  .round > .inst-logo { border-radius: 50%; }
  .round > .inst-logo--img { padding: 6px; }
</style>
</head>
<body>
  <h1 class="h4">Institution tiles</h1>
  <p class="meta" data-count></p>
  <div data-out></div>
<script type="module">
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  window.HISAB_SPRITE = '../shared/icons/sprite.svg';
  const { institutions, bankLogo } = await import('../shared/js/components/bank-logo.js');
  const { merchants } = await import('../shared/js/components/merchant-logo.js');
  const bd = (i) => i.kind === 'bank' && !i.region && !i.group;
  const groups = [
    ['Banks in Bangladesh', institutions.filter(bd)],
    ['Gulf banks', institutions.filter((i) => i.region === 'ae')],
    ['Online accounts', institutions.filter((i) => i.group === 'online')],
    ['Mobile wallets', institutions.filter((i) => i.kind === 'mfs')],
    ['Cards', institutions.filter((i) => i.kind === 'card')],
    ['Generic', institutions.filter((i) => i.kind === 'generic')],
    ['Merchants and billers', merchants],
  ];
  const out = document.querySelector('[data-out]');
  out.innerHTML = groups.map(([title, list]) => `
    <h2>${title} <span class="meta">${list.length}</span></h2>
    <div class="gallery">
      ${list.map((i) => `
        <div class="tile">
          <div class="sizes">${bankLogo(i, 24)}${bankLogo(i, 40)}<span class="round">${bankLogo(i, 40)}</span></div>
          <span>${i.name}${i.logo ? '' : ' ·&nbsp;mono'}</span>
        </div>`).join('')}
    </div>`).join('');
  const all = [...institutions, ...merchants];
  const withLogo = all.filter((i) => i.logo).length;
  document.querySelector('[data-count]').textContent =
    `${institutions.filter(bd).length} Bangladesh banks · ${all.length} tiles · ${withLogo} with a logo file · ${all.length - withLogo} drawn`;
</script>
</body>
</html>
