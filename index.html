<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <!-- BEFORE the script below, and that order is load-bearing. A phone's
       layout viewport is 980px until this tag is parsed, so any matchMedia
       running above it answers as though the device were a desktop. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script>
    /* PRE-PAINT. Inline, and first, on purpose: a deferred script runs after
       the first paint, and the first paint is exactly what this exists to get
       right. A night-theme user who sees one white frame on every navigation
       has a broken app, however correct it looks a moment later.

       This block is the twin of applyTheme() in shared/js/core/state.js. If one
       changes, so must the other. It is duplicated into every page rather than
       imported because an import cannot run before paint.

       It is byte-identical in every page, and tools/check-pages.py asserts
       that, because duplicated code drifts. That tool also prints the
       Content-Security-Policy hash for this exact block; if the two disagree,
       the browser blocks the script and every page paints the white frame this
       is here to prevent.

       .no-js is removed here too, so [data-reveal] content is only hidden when
       JavaScript is actually present to reveal it. */
    document.documentElement.classList.remove('no-js');
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('hisab:theme');
      if (theme) {
        var value = JSON.parse(theme);
        /* Both directions matter. A stored 'day' must ADD the attribute and a
           cleared preference must REMOVE it, or someone who switches back to
           following their device stays stuck on their old choice. */
        if (value === 'day' || value === 'night') root.setAttribute('data-theme', value);
        else root.removeAttribute('data-theme');
      }
      var density = localStorage.getItem('hisab:density');
      if (density && JSON.parse(density) === 'compact') root.setAttribute('data-density', 'compact');
      var hand = localStorage.getItem('hisab:hand');
      if (hand && JSON.parse(hand) === 'left') root.setAttribute('data-hand', 'left');
    } catch (e) { /* storage off, or private mode - the built-in theme stands. */ }
  </script>

  <title>Home — Hisab</title>
  <meta name="description" content="Personal and business accounts, cash flow, investments and a sealed vault for sensitive information.">
  <meta name="theme-color" content="#06080B">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="Md Imran Hossain">
  <!-- A private ledger has no business in a search index. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.svg">
  <!-- Both spellings: Chrome deprecated the apple- prefix, iOS still only
       reads that one. Dropping either loses the standalone launch on one of
       the two platforms this is actually used on. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="shared/css/hisab.css">
  <link rel="stylesheet" href="modules/overview/overview.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <!-- Filled by shared/js/components/shell.js. They are in the markup rather
         than created by script so the page keeps its landmark structure with
         JavaScript disabled, and so the grid does not reflow when JS arrives. -->
    <header class="app-header"></header>
    <nav class="app-rail" aria-label="Sections"></nav>

    <main class="app-main" id="main">
      <div class="page home">

        <!-- ================= The month and the book =================
             Which month and which book everything below is about, as the
             first thing on the screen. The month opens a list of months;
             the book pill switches between personal and business when there
             is a business book to switch to. -->
        <div class="home-top">
          <button type="button" class="home-month" data-month-open aria-haspopup="dialog">
            <span data-month-name>This month</span>
            <svg class="icon icon--sm" aria-hidden="true"><use href="shared/icons/sprite.svg#i-chevron-down"/></svg>
          </button>
          <button type="button" class="home-book" data-book-toggle disabled>
            <span data-book-name>Personal</span>
          </button>
        </div>

        <!-- ================= Left to spend =================
             The one question a phone user opens this screen with: how is the
             month going, and how much can I still spend? So the answer is the
             only large figure on the screen, straight on the canvas and not
             in a box, with the pace under it. Net worth is on Accounts, where
             it answers that screen's question instead of crowding this one. -->
        <section class="home-hero" aria-labelledby="left-h">
          <h2 class="home-hero__label" id="left-h" data-left-label>Left to spend this month</h2>
          <div class="home-hero__figure money" data-left>
            <span class="skeleton skeleton--fig home-hero__skeleton"></span>
          </div>

          <div class="home-pace" data-pace-box>
            <div class="home-pace__bar" data-left-meter hidden>
              <span class="home-pace__fill" data-left-fill></span>
              <span class="home-pace__now" data-left-today hidden></span>
            </div>
            <p class="home-pace__text">
              <span data-pace></span>
              <span class="home-pace__used" data-used></span>
            </p>
          </div>
        </section>

        <dl class="home-flow" aria-label="How the month moved">
          <div class="home-flow__item home-flow__item--in">
            <dt>In</dt><dd class="money" data-flow-in>—</dd>
          </div>
          <div class="home-flow__item home-flow__item--hold">
            <dt>Saved</dt><dd class="money" data-flow-hold>—</dd>
          </div>
          <div class="home-flow__item home-flow__item--out">
            <dt>Out</dt><dd class="money" data-flow-out>—</dd>
          </div>
        </dl>

        <!-- ================= Today =================
             What was spent today and on what. The entry you just added is the
             one you most want to see, so it is here, not three screens down. -->
        <section class="home-sec" aria-labelledby="today-h">
          <div class="home-sec__head">
            <h2 class="home-sec__title" id="today-h">Today</h2>
            <span class="home-sec__aside" data-today-total></span>
          </div>
          <div class="card card--flush home-card">
            <ul class="list" data-today>
              <li><div class="row row--static"><div class="skeleton skeleton--glyph"></div><div class="row__main"><span class="skeleton skeleton--line"></span></div></div></li>
            </ul>
          </div>
        </section>

        <!-- ================= Accounts strip =================
             Spendable accounts only: "where can I pay from" is the question
             here. Savings and investments are on Accounts. -->
        <section class="home-sec" aria-labelledby="acc-h">
          <div class="home-sec__head">
            <h2 class="home-sec__title" id="acc-h">Accounts</h2>
            <a class="home-sec__link" href="modules/accounts/list.html" data-accounts-all>All</a>
          </div>
          <ul class="home-accounts scroll-x" data-accounts>
            <li class="home-account home-account--loading"><span class="skeleton skeleton--line"></span></li>
            <li class="home-account home-account--loading"><span class="skeleton skeleton--line"></span></li>
          </ul>
        </section>

        <!-- ================= Where it went ================= -->
        <section class="home-sec" data-breakdown hidden aria-labelledby="where-h">
          <div class="home-sec__head">
            <h2 class="home-sec__title" id="where-h">Where it went</h2>
            <a class="home-sec__link" href="modules/reports/insights.html">Month</a>
          </div>
          <div class="home-bands" data-breakdown-bar></div>
          <div class="home-legend" data-breakdown-legend></div>
        </section>

        <!-- ================= What the numbers say =================
             One line each, number first. Generated from the month's own
             figures; an observation that would say nothing is not shown. -->
        <section class="home-sec" data-insights hidden aria-label="What the numbers say">
          <ul class="home-notes" data-insight-list></ul>
        </section>

      </div>
    </main>
  </div>

  <!-- No floating Add button: on a phone it sat on top of the category bar.
       Adding is the header's job until the bar's centre + arrives (A2). -->

  <nav class="tabbar" aria-label="Primary"></nav>

  <script type="module" src="shared/js/main.js"></script>
  <script type="module" src="modules/overview/overview-page.js"></script>
</body>
</html>
