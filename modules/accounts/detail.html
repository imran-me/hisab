<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script>
    /* PRE-PAINT. Inline, and first, on purpose: a deferred script runs after
       the first paint, and the first paint is exactly what this exists to get
       right. A night-theme user who sees one white frame on every navigation
       has a broken app, however correct it looks a moment later.

       This block is the twin of applyTheme() in shared/js/core/state.js. If one
       changes, so must the other. It is duplicated into every page rather than
       imported because an import cannot run before paint.

       It is byte-identical in every page, and tools/check-pages.py asserts
       that, because duplicated code drifts. That tool also prints the
       Content-Security-Policy hash for this exact block; if the two disagree,
       the browser blocks the script and every page paints the white frame this
       is here to prevent.

       .no-js is removed here too, so [data-reveal] content is only hidden when
       JavaScript is actually present to reveal it. */
    document.documentElement.classList.remove('no-js');
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('hisab:theme');
      if (theme) {
        var value = JSON.parse(theme);
        /* Both directions matter. A stored 'day' must ADD the attribute and a
           cleared preference must REMOVE it, or someone who switches back to
           following their device stays stuck on their old choice. */
        if (value === 'day' || value === 'night') root.setAttribute('data-theme', value);
        else root.removeAttribute('data-theme');
      }
      var density = localStorage.getItem('hisab:density');
      if (density && JSON.parse(density) === 'compact') root.setAttribute('data-density', 'compact');
      var hand = localStorage.getItem('hisab:hand');
      if (hand && JSON.parse(hand) === 'left') root.setAttribute('data-hand', 'left');
    } catch (e) { /* storage off, or private mode - the built-in theme stands. */ }
  </script>

  <title>Account — Hisab</title>
  <meta name="description" content="One account: its balance, and every entry that moved it.">
  <meta name="theme-color" content="#0C0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../../shared/css/hisab.css">
  <link rel="stylesheet" href="accounts.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <header class="app-header"></header>
    <nav class="app-rail" aria-label="Sections"></nav>

    <main class="app-main" id="main">
      <div class="page acc-detail">

        <!-- The answer first: what is in this account now. In the account's
             own currency, never converted - this is the one screen where the
             figure should match the bank's app to the poisha. -->
        <section class="acc-hero" aria-labelledby="acc-name">
          <p class="acc-hero__meta" data-meta></p>
          <h2 class="acc-hero__name" id="acc-name" data-name>
            <span class="skeleton skeleton--line"></span>
          </h2>
          <div class="acc-hero__balance money" data-balance></div>
          <p class="acc-hero__note" data-note hidden></p>
        </section>

        <!-- This month through this account: what came in and what went out. -->
        <dl class="acc-month" data-month hidden aria-label="This month in this account">
          <div class="acc-month__item acc-month__item--in"><dt>In this month</dt><dd class="money" data-month-in>—</dd></div>
          <div class="acc-month__item"><dt>Out this month</dt><dd class="money" data-month-out>—</dd></div>
        </dl>

        <section class="acc-entries" aria-labelledby="entries-h">
          <div class="acc-entries__head">
            <h2 class="acc-entries__title" id="entries-h">Entries</h2>
            <span class="acc-entries__count" data-count></span>
          </div>
          <div class="card card--flush acc-card">
            <ul class="list" data-entries>
              <li><div class="row row--static"><div class="skeleton skeleton--glyph"></div><div class="row__main"><span class="skeleton skeleton--line"></span></div></div></li>
            </ul>
          </div>
          <button type="button" class="btn btn--ghost btn--sm acc-entries__more" data-more hidden>Show older entries</button>
        </section>

      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Primary"></nav>

  <script type="module" src="../../shared/js/main.js"></script>
  <script type="module" src="detail-page.js"></script>
</body>
</html>
