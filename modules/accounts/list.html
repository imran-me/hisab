<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script>
    /* PRE-PAINT. Inline, and first, on purpose: a deferred script runs after
       the first paint, and the first paint is exactly what this exists to get
       right. A night-theme user who sees one white frame on every navigation
       has a broken app, however correct it looks a moment later.

       This block is the twin of applyTheme() in shared/js/core/state.js. If one
       changes, so must the other. It is duplicated into every page rather than
       imported because an import cannot run before paint.

       It is byte-identical in every page, and tools/check-pages.py asserts
       that, because duplicated code drifts. That tool also prints the
       Content-Security-Policy hash for this exact block; if the two disagree,
       the browser blocks the script and every page paints the white frame this
       is here to prevent.

       .no-js is removed here too, so [data-reveal] content is only hidden when
       JavaScript is actually present to reveal it. */
    document.documentElement.classList.remove('no-js');
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('hisab:theme');
      if (theme) {
        var value = JSON.parse(theme);
        /* Both directions matter. A stored 'day' must ADD the attribute and a
           cleared preference must REMOVE it, or someone who switches back to
           following their device stays stuck on their old choice. */
        if (value === 'day' || value === 'night') root.setAttribute('data-theme', value);
        else root.removeAttribute('data-theme');
      }
      var density = localStorage.getItem('hisab:density');
      if (density && JSON.parse(density) === 'compact') root.setAttribute('data-density', 'compact');
      var hand = localStorage.getItem('hisab:hand');
      if (hand && JSON.parse(hand) === 'left') root.setAttribute('data-hand', 'left');
    } catch (e) { /* storage off, or private mode - the built-in theme stands. */ }
  </script>

  <title>Accounts — Hisab</title>
  <meta name="description" content="Cash, bank, mobile money, cards, savings and investments — every account in one place.">
  <meta name="theme-color" content="#0C0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../../shared/css/hisab.css">
  <link rel="stylesheet" href="accounts.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <header class="app-header"></header>
    <nav class="app-rail" aria-label="Sections"></nav>

    <main class="app-main" id="main">
      <div class="page stack stack--5">

        <!-- The answer first: where is my money right now? Net worth is the
             one large figure here (it moved off Home, where it crowded the
             month), with the split that matters under it: what you can spend
             today, and what is yours but held. -->
        <section class="acc-net" aria-labelledby="totals-h">
          <h2 class="acc-net__label" id="totals-h">Net worth</h2>
          <div class="acc-net__figure money" data-total-net>
            <span class="skeleton skeleton--fig"></span>
          </div>
          <dl class="acc-net__split">
            <div class="acc-net__part">
              <dt>Spendable <span data-count-spendable></span></dt>
              <dd class="money" data-total-spendable>—</dd>
            </div>
            <div class="acc-net__part acc-net__part--hold">
              <dt>Held <span data-count-held></span></dt>
              <dd class="money" data-total-held>—</dd>
            </div>
          </dl>
          <p class="meta" data-totals-note hidden></p>
        </section>

        <!-- Grouped by whether the money is spendable today. The grouping IS
             the point of this screen: a DPS listed between a cash wallet and a
             bKash balance invites it to be counted as available. -->
        <section class="stack stack--3" aria-labelledby="spend-h">
          <div class="section-head">
            <div class="section-head__title">
              <h2 class="h3" id="spend-h">Spendable</h2>
            </div>
            <button type="button" class="btn btn--secondary btn--sm section-head__action" data-new-account>
              <svg class="icon icon--sm" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-plus"/></svg>
              New
            </button>
          </div>
          <div class="card card--flush">
            <ul class="list" data-spendable></ul>
          </div>
        </section>

        <section class="stack stack--3" data-held-section hidden aria-labelledby="held-h">
          <div class="section-head">
            <div class="section-head__title">
              <h2 class="h3" id="held-h">Savings &amp; investment</h2>
            </div>
          </div>
          <div class="card card--flush">
            <ul class="list" data-held></ul>
          </div>
        </section>

        <section class="stack stack--3" data-archived-section hidden aria-labelledby="arch-h">
          <div class="section-head">
            <div class="section-head__title">
              <h2 class="h3" id="arch-h">Archived</h2>
            </div>
          </div>
          <p class="meta">Hidden from pickers. Every past entry that used them still resolves.</p>
          <div class="card card--flush">
            <ul class="list" data-archived></ul>
          </div>
        </section>

      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Primary"></nav>

  <script type="module" src="../../shared/js/main.js"></script>
  <script type="module" src="list-page.js"></script>
</body>
</html>
