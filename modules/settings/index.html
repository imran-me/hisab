<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script>
    /* PRE-PAINT. Inline, and first, on purpose: a deferred script runs after
       the first paint, and the first paint is exactly what this exists to get
       right. A night-theme user who sees one white frame on every navigation
       has a broken app, however correct it looks a moment later.

       This block is the twin of applyTheme() in shared/js/core/state.js. If one
       changes, so must the other. It is duplicated into every page rather than
       imported because an import cannot run before paint.

       It is byte-identical in every page, and tools/check-pages.py asserts
       that, because duplicated code drifts. That tool also prints the
       Content-Security-Policy hash for this exact block; if the two disagree,
       the browser blocks the script and every page paints the white frame this
       is here to prevent.

       .no-js is removed here too, so [data-reveal] content is only hidden when
       JavaScript is actually present to reveal it. */
    document.documentElement.classList.remove('no-js');
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('hisab:theme');
      if (theme) {
        var value = JSON.parse(theme);
        /* Both directions matter. A stored 'day' must ADD the attribute and a
           cleared preference must REMOVE it, or someone who switches back to
           following their device stays stuck on their old choice. */
        if (value === 'day' || value === 'night') root.setAttribute('data-theme', value);
        else root.removeAttribute('data-theme');
      }
      var density = localStorage.getItem('hisab:density');
      if (density && JSON.parse(density) === 'compact') root.setAttribute('data-density', 'compact');
      var hand = localStorage.getItem('hisab:hand');
      if (hand && JSON.parse(hand) === 'left') root.setAttribute('data-hand', 'left');
    } catch (e) { /* storage off, or private mode - the built-in theme stands. */ }
  </script>

  <title>Settings — Hisab</title>
  <meta name="description" content="Appearance and preferences.">
  <meta name="theme-color" content="#0C0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../../shared/css/hisab.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <header class="app-header"></header>
    <nav class="app-rail" aria-label="Sections"></nav>

    <main class="app-main" id="main">
      <div class="page set">

        <!-- ================= Look =================
             One row per setting: a coloured circle, the name and what it does,
             and the control on the right or underneath. Every choice applies
             the moment it is tapped: there is no Save on this screen. -->
        <section class="set__group" aria-labelledby="look-h">
          <h2 class="set__head" id="look-h">Look</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row set__row--stack">
              <span class="row__glyph cat-mobile"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-moon"/></svg></span>
              <div class="set__main">
                <span class="set__name" id="theme-l">Theme</span>
                <span class="set__hint" data-theme-hint></span>
              </div>
              <!--
                THREE options, not a two-way switch. Dark is the default;
                "Phone" is a real, stored choice ('system'), which the CSS
                expresses as :root:not([data-theme]).
              -->
              <div class="set__seg" data-theme-choices role="radiogroup" aria-labelledby="theme-l">
                <label><input type="radio" name="theme" value="night"><span>Dark</span></label>
                <label><input type="radio" name="theme" value="day"><span>Light</span></label>
                <label><input type="radio" name="theme" value="system"><span>Phone</span></label>
              </div>
            </li>
            <li class="set__row set__row--stack">
              <span class="row__glyph cat-shopping"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-list"/></svg></span>
              <div class="set__main">
                <span class="set__name" id="density-l">Density</span>
                <span class="set__hint">Compact fits more rows on a screen.</span>
              </div>
              <div class="set__seg" data-density-choices role="radiogroup" aria-labelledby="density-l">
                <label><input type="radio" name="density" value="default"><span>Comfortable</span></label>
                <label><input type="radio" name="density" value="compact"><span>Compact</span></label>
              </div>
            </li>
            <li class="set__row set__row--stack">
              <span class="row__glyph cat-food"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-globe"/></svg></span>
              <div class="set__main">
                <span class="set__name" id="digits-l">Digits</span>
                <span class="set__hint" data-digits-preview></span>
              </div>
              <div class="set__seg" data-digits-choices role="radiogroup" aria-labelledby="digits-l">
                <label><input type="radio" name="digits" value="latin"><span>123</span></label>
                <label><input type="radio" name="digits" value="bangla"><span lang="bn">১২৩</span></label>
              </div>
            </li>
          </ul>
        </section>

        <!-- ================= Money ================= -->
        <section class="set__group" aria-labelledby="money-h">
          <h2 class="set__head" id="money-h">Money</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row">
              <span class="row__glyph cat-utilities"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-coins"/></svg></span>
              <label class="set__main" for="set-currency">
                <span class="set__name">Home currency</span>
                <span class="set__hint" data-currency-hint></span>
              </label>
              <select class="select set__select" id="set-currency" data-currency></select>
            </li>
          </ul>
        </section>

        <!-- ================= Touch ================= -->
        <section class="set__group" aria-labelledby="touch-h">
          <h2 class="set__head" id="touch-h">Touch</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row">
              <span class="row__glyph cat-home"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-user"/></svg></span>
              <div class="set__main">
                <span class="set__name" id="hand-l">Reaching hand</span>
                <span class="set__hint">Moves what you reach for to this side.</span>
              </div>
              <div class="set__seg set__seg--end" data-hand-choices role="radiogroup" aria-labelledby="hand-l">
                <label><input type="radio" name="hand" value="left"><span>Left</span></label>
                <label><input type="radio" name="hand" value="right"><span>Right</span></label>
              </div>
            </li>
            <li class="set__row" data-haptics-row>
              <span class="row__glyph cat-health"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-fingerprint"/></svg></span>
              <label class="set__main" for="set-haptics">
                <span class="set__name">Vibrate on tap</span>
                <span class="set__hint" data-haptics-hint>A light tick on +, Save and a finished drag.</span>
              </label>
              <span class="switch">
                <input type="checkbox" id="set-haptics" data-haptics>
                <span class="switch__track" aria-hidden="true"></span>
              </span>
            </li>
          </ul>
        </section>

        <!-- ================= Demo data =================
             Only rendered when there is a server, because that is the only
             place the generator runs. -->
        <section class="set__group" data-demo-section hidden aria-labelledby="demo-h">
          <h2 class="set__head" id="demo-h">Demo data</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row">
              <span class="row__glyph cat-transport"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-inbox"/></svg></span>
              <div class="set__main">
                <span class="set__name" data-demo-title>Demo entries</span>
                <span class="set__hint" data-demo-note>Checking…</span>
              </div>
              <button type="button" class="btn btn--secondary btn--sm" data-demo-add hidden>Add</button>
              <button type="button" class="btn btn--danger btn--sm" data-demo-remove hidden>Remove</button>
            </li>
          </ul>
        </section>

        <!-- ================= Account =================
             Only rendered when someone is signed in to a server. -->
        <section class="set__group" data-account-section hidden aria-labelledby="account-h">
          <h2 class="set__head" id="account-h">Account</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row">
              <span class="row__glyph cat-work"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-user"/></svg></span>
              <div class="set__main">
                <span class="set__name" data-account-email></span>
                <span class="set__hint">Signed in on this device</span>
              </div>
              <button type="button" class="btn btn--ghost btn--sm set__danger" data-sign-out>Sign out</button>
            </li>
          </ul>
        </section>

        <!-- ================= About ================= -->
        <section class="set__group" aria-labelledby="about-h">
          <h2 class="set__head" id="about-h">About</h2>
          <ul class="card card--flush list set__list">
            <li class="set__row">
              <span class="row__glyph row__glyph--vault"><svg class="icon" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-shield-lock"/></svg></span>
              <div class="set__main">
                <span class="set__name">Where your data is</span>
                <span class="set__hint" data-storage-note></span>
              </div>
            </li>
          </ul>
        </section>

      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Primary"></nav>

  <script type="module" src="../../shared/js/main.js"></script>
  <script type="module" src="settings-page.js"></script>
</body>
</html>
