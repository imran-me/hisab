<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script>
    /* PRE-PAINT. Inline, and first, on purpose: a deferred script runs after
       the first paint, and the first paint is exactly what this exists to get
       right. A night-theme user who sees one white frame on every navigation
       has a broken app, however correct it looks a moment later.

       This block is the twin of applyTheme() in shared/js/core/state.js. If one
       changes, so must the other. It is duplicated into every page rather than
       imported because an import cannot run before paint.

       It is byte-identical in every page, and tools/check-pages.py asserts
       that, because duplicated code drifts. That tool also prints the
       Content-Security-Policy hash for this exact block; if the two disagree,
       the browser blocks the script and every page paints the white frame this
       is here to prevent.

       .no-js is removed here too, so [data-reveal] content is only hidden when
       JavaScript is actually present to reveal it. */
    document.documentElement.classList.remove('no-js');
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('hisab:theme');
      if (theme) {
        var value = JSON.parse(theme);
        /* Both directions matter. A stored 'day' must ADD the attribute and a
           cleared preference must REMOVE it, or someone who switches back to
           following their device stays stuck on their old choice. */
        if (value === 'day' || value === 'night') root.setAttribute('data-theme', value);
        else root.removeAttribute('data-theme');
      }
      var density = localStorage.getItem('hisab:density');
      if (density && JSON.parse(density) === 'compact') root.setAttribute('data-density', 'compact');
      var hand = localStorage.getItem('hisab:hand');
      if (hand && JSON.parse(hand) === 'left') root.setAttribute('data-hand', 'left');
    } catch (e) { /* storage off, or private mode - the built-in theme stands. */ }
  </script>

  <title>Budgets and goals — Hisab</title>
  <meta name="description" content="A monthly limit per category: what is left, and at what pace.">
  <meta name="theme-color" content="#0C0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../../shared/css/hisab.css">
  <link rel="stylesheet" href="../reports/period-top.css">
  <link rel="stylesheet" href="budgets.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <header class="app-header"></header>
    <nav class="app-rail" aria-label="Sections"></nav>

    <main class="app-main" id="main">
      <div class="page budgets">

        <div class="period-top">
          <button type="button" class="period-top__month" data-month-open aria-haspopup="dialog">
            <span data-month-name>This month</span>
            <svg class="icon icon--sm" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-chevron-down"/></svg>
          </button>
          <button type="button" class="period-top__book" data-book-toggle disabled>
            <span data-book-name>Personal</span>
          </button>
        </div>

        <!-- The screen's question: how much is left in my budgets, and at
             what pace can I spend it? One ring for all of them, the figure
             beside it. -->
        <section class="bud-hero" data-hero aria-labelledby="bud-left-h">
          <div class="bud-dial" data-hero-dial>
            <span class="skeleton skeleton--glyph"></span>
          </div>
          <div class="bud-hero__text">
            <h2 class="bud-hero__label" id="bud-left-h" data-hero-label>Left in your budgets</h2>
            <div class="bud-hero__figure money" data-hero-left><span class="skeleton skeleton--fig"></span></div>
            <p class="bud-hero__pace" data-hero-pace></p>
            <p class="bud-hero__meta" data-hero-meta></p>
          </div>
        </section>

        <section class="bud-sec" data-budgeted-sec hidden aria-labelledby="bud-list-h">
          <div class="bud-sec__head">
            <h2 class="bud-sec__title" id="bud-list-h">Your budgets</h2>
            <span class="bud-sec__aside" data-budgeted-aside></span>
          </div>
          <div class="card card--flush">
            <ul class="list" data-budgeted></ul>
          </div>
        </section>

        <!-- Savings goals: a target and what feeds it, progress from the
             ledger. After the budgets because the month's question comes
             first; before the offers because a goal is already a decision. -->
        <section class="bud-sec" data-goals-sec hidden aria-labelledby="bud-goals-h">
          <div class="bud-sec__head">
            <h2 class="bud-sec__title" id="bud-goals-h">Goals</h2>
            <button type="button" class="bud-add" data-goal-new>
              <svg class="icon icon--sm" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-plus"/></svg>
              <span>New goal</span>
            </button>
          </div>
          <ul class="goals" data-goals></ul>
        </section>

        <!-- Every other expense category, the costly ones first, each with a
             one-tap "Set" at the server's round suggestion. -->
        <section class="bud-sec" data-offer-sec hidden aria-labelledby="bud-offer-h">
          <div class="bud-sec__head">
            <h2 class="bud-sec__title" id="bud-offer-h" data-offer-title>Not budgeted yet</h2>
          </div>
          <div class="card card--flush">
            <ul class="list" data-offer></ul>
            <button type="button" class="bud-more" data-offer-more hidden></button>
          </div>
        </section>

        <div class="empty" data-offline hidden>
          <span class="empty__glyph">
            <svg class="icon icon--lg" aria-hidden="true"><use href="../../shared/icons/sprite.svg#i-target"/></svg>
          </span>
          <span class="empty__title">Budgets need the server</span>
          <p class="empty__text">A budget is checked against every entry on the server, so it can only be set while this device is connected and signed in.</p>
        </div>

      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Primary"></nav>

  <script type="module" src="../../shared/js/main.js"></script>
  <script type="module" src="list-page.js"></script>
</body>
</html>
